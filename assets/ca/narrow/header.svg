<svg xmlns="http://www.w3.org/2000/svg" width="420" height="424" viewBox="0 0 420 424">
  <defs>
    <radialGradient id="glow" cx="50%" cy="22%" r="62%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".34"/>
      <stop offset=".5" stop-color="#0f172a" stop-opacity=".2"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="88%" cy="92%" r="52%">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".22"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".25" stop-color="#a5f3fc"/>
      <stop offset=".6" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22d3ee" stop-opacity=".9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#22d3ee" stroke-opacity=".06"/>
    </pattern>
    <clipPath id="frame"><rect width="420" height="424" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="420" height="424" fill="#020617"/>
    <rect width="420" height="424" fill="url(#grid)"/>
    <rect width="420" height="424" fill="url(#glow)"/>
    <rect width="420" height="424" fill="url(#violet)"/>
    <g fill="#e2e8f0">
      <circle cx="54" cy="44" r="1.2" opacity=".6"><animate attributeName="opacity" values=".2;.8;.2" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="366" cy="60" r="1.4" opacity=".7"><animate attributeName="opacity" values=".3;.9;.3" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="384" cy="206" r="1" opacity=".5"/>
      <circle cx="36" cy="188" r="1.1" opacity=".5"><animate attributeName="opacity" values=".6;.2;.6" dur="6s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(210 92)">
      <circle r="74" fill="none" stroke="#22d3ee" stroke-opacity=".18"/>
      <g>
        <circle r="60" fill="none" stroke="#22d3ee" stroke-opacity=".55" stroke-width="2" stroke-dasharray="76 20 26 20"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle r="44" fill="none" stroke="#a855f7" stroke-opacity=".6" stroke-width="2" stroke-dasharray="38 16 9 16"/>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
      </g>
      <g>
        <ellipse rx="96" ry="28" fill="none" stroke="#e2e8f0" stroke-opacity=".12" transform="rotate(-18)"/>
        <circle cx="96" cy="0" r="3.5" fill="#fbbf24" transform="rotate(-18)"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
      </g>
      <circle r="28" fill="url(#core)"><animate attributeName="r" values="25;31;25" dur="4s" repeatCount="indefinite"/></circle>
      <circle r="7" fill="#ffffff"/>
    </g>
    <text x="210" y="208" text-anchor="middle" fill="#22d3ee" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', monospace" font-size="13" letter-spacing="4.5">HOLA, SÓC</text>
    <text x="210" y="254" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-1">Aleix Auqué</text>
    <text x="210" y="285" text-anchor="middle" fill="#22d3ee" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600">Software Developer · Full-stack</text>
    <text x="210" y="318" text-anchor="middle" fill="#cbd5e1" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16">Més de 5 anys portant programari</text>
    <text x="210" y="340" text-anchor="middle" fill="#cbd5e1" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16">a producció: web, escriptori, jocs i IA.</text>
    <path d="M90 360 H330" stroke="url(#line)" stroke-width="2"/>
    <text x="210" y="382" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', monospace" font-size="12.5" letter-spacing=".5">JavaScript · TypeScript · PHP</text>
    <text x="210" y="404" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', monospace" font-size="12.5" letter-spacing=".5">React · Laravel · Three.js</text>
  </g>
  <rect x=".75" y=".75" width="418.5" height="422.5" rx="21.25" fill="none" stroke="#22d3ee" stroke-opacity=".25" stroke-width="1.5"/>
</svg>
